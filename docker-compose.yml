version: "3.9"

services:

  # ---------------------------------------------------------
  # Qdrant vector database
  # ---------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: lexai-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------
  # FastAPI backend
  # ---------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lexai-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------
  # Streamlit frontend
  # ---------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: lexai-frontend
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:8000/api/v1
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  qdrant_storage: